Global:
  model_name: PP-OCRv5_server_rec # To use static model for inference.
  # use_amp: true
  use_amp: true
  scale_loss: 1024.0
  use_dynamic_loss_scaling: true  
  debug: false
  use_gpu: true
  epoch_num: 50
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/PP-OCRv5_server_rec_all
  save_epoch_step: 1
  eval_batch_step: [0, 20000]
  cal_metric_during_train: true
  calc_epoch_interval: 1
  # pretrained_model: /media/anhlbt/SSD2/workspace/OCR/PaddleOCR/output/PP-OCRv5_server_rec_all/best_model/model.pdparams # /media/anhlbt/SSD2/workspace/OCR/PaddleOCR/pretrained_models/PP-OCRv5_server_rec_pretrained.pdparams #https://paddle-model-ecology.bj.bcebos.com/paddlex/official_pretrained_model/PP-OCRv5_server_rec_pretrained.pdparams
  checkpoints: /media/anhlbt/SSD2/workspace/OCR/PaddleOCR/output/PP-OCRv5_server_rec_all/best_model/model.pdparams
  save_inference_dir:
  use_visualdl: false
  infer_img: /media/SSD3/paddleocr_dataset/paragraphs_vi/paragraphs_vi/3.jpg # bên thủy lợi với lâm nghiệp thôi
  character_dict_path: /media/SSD3/paddleocr_dataset/dict_all.txt
  max_text_length: &max_text_length 100
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: null #./output/rec/predicts_ppocrv5.txt
  d2s_train_image_shape: [3, 48, 800]
  # export CUDA_VISIBLE_DEVICES=0


Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0003
    warmup_epoch: 3
  regularizer:
    name: L2
    factor: 1.0e-06


Architecture:
  model_type: rec
  algorithm: SVTR_HGNet
  Transform:
  Backbone:
    name: PPHGNetV2_B4
    text_rec: True
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 768
          max_text_length: *max_text_length
          dropout: 0.1

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:  
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: /media/SSD3/paddleocr_dataset
    ext_op_transform_idx: 1
    label_file_list:
    - /media/SSD3/paddleocr_dataset/rec_gt_train.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecAug:
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 48], [480, 48], [640, 48], [800, 48]] # [[320, 32], [320, 48], [320, 64], [640, 32]] # 
    first_bs: &bs 128 # 64 -> 8Gb
    fix_bs: false
    divided_factor: [8, 16] # w, h
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 8
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /media/SSD3/paddleocr_dataset
    label_file_list:
    - /media/SSD3/paddleocr_dataset/rec_gt_val.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 800]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 12
